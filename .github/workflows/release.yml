name: release

# A tag v* builds xdevcmd for every platform and opens a DRAFT release with the
# archives, SHA256SUMS and the third-party licences; a person reads it and presses
# Publish. A release (v1.2.3) is tagged on main; a pre-release (v1.2.3-beta.N, -rc.N) on
# dev or main, and its draft is marked pre-release, never "Latest" (the owner,
# 2026-11-13: pre-releases go to GitHub only). A tag cannot be filtered by branch here,
# so the first job refuses one that breaks the rules (scripts/release-check.sh) or whose
# commit has not passed ci (scripts/ci-green.sh), and nothing is built after it. Run by
# hand with a tag name, only the rules are tried, before the tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check (nothing is built): v0.4.0-beta.1"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Before anything is built for a tag: the tag, the version in Cargo.toml and a dated
  # CHANGELOG section all name the same release, and the tag is on the branch its kind
  # is cut from (scripts/release-check.sh says which).
  check:
    name: tag, version and changelog agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check
        id: check
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          scripts/release-check.sh "$TAG" "$GITHUB_SHA" | tee out.txt
          tail -n 1 out.txt >> "$GITHUB_OUTPUT"
      # The tag's commit passed ci: a tag push starts this at once, in parallel with that
      # commit's CI (Round 032), so it waits for it here (up to an hour) and builds
      # nothing unless a run passed.
      - name: ci passed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-green.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" 60

  licences:
    name: third-party licences
    needs: check
    # A run by hand only checks.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-about --features cli
      # Fails if any crate is under a licence about.toml does not accept.
      - run: cargo about generate about.hbs -o THIRD-PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: licences
          path: THIRD-PARTY.md

  build:
    name: ${{ matrix.target }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Static: runs on any x86_64 Linux, old distributions included.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # The same for 64-bit ARM Linux (servers, Raspberry Pi with a 64-bit system),
          # built on GitHub's ARM runner: nothing here compiles C, so no cross tools.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p xdevcmd --target ${{ matrix.target }}
        env:
          # xdevcmd.exe without its icon is a broken release, not a warning.
          XDEVCMD_REQUIRE_ICON: ${{ contains(matrix.target, 'windows') && '1' || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: licences
      - name: package
        shell: bash
        run: |
          name="xdevcmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md THIRD-PARTY.md "$name/"
          # Example themes: read from themes/ beside the binary, so they work unpacked.
          cp -r themes "$name/"
          # Language files: built in, and also in lang/ beside the binary, where a user
          # can read and change them; template.txt is the start of a new one.
          cp -r crates/xdevcmd/lang "$name/"
          # This version's documentation, for a machine without a browser or a network:
          # Help → Documentation names docs/ beside the binary first.
          mkdir "$name/docs"
          cp docs/*.md "$name/docs/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/xdevcmd.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/xdevcmd" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      # The archive itself, as a user gets it: unpacked elsewhere, its files there, the
      # binary under 7 MiB, and run (where this runner's CPU can): its version is the
      # tag's, and the --print commands work.
      - name: smoke test
        shell: bash
        run: scripts/smoke.sh xdevcmd-${GITHUB_REF_NAME}-*.* "$GITHUB_REF_NAME"
      # The test kit: xtask, for the benchmark and the tester's sandbox
      # (docs/benchmark.md, docs/how-to-test.md); named xdevcmd-bench up to
      # 0.4.0-beta.2. Built here with the binary it measures, in an archive of its own:
      # xdevcmd's stays lean, and an Actions artifact would go after 14 days.
      # It never holds the release: a failure here leaves it out of the draft, where the
      # person who publishes sees it missing.
      - name: test kit
        id: bench
        continue-on-error: true
        shell: bash
        run: |
          cargo build --release --locked -p xtask --target ${{ matrix.target }}
          name="xdevcmd-testkit-${GITHUB_REF_NAME}-${{ matrix.target }}"
          # Made apart, and moved where the upload looks only once it has run.
          mkdir -p bench-stage/"$name"
          cp LICENSE docs/how-to-test.md docs/benchmark.md bench-stage/"$name"/
          exe="target/${{ matrix.target }}/release/xtask"
          cd bench-stage
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "../$exe.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "../$exe" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # As a tester runs it: unpacked elsewhere, one small case, its results there,
          # and --help. Not run only where this runner's CPU cannot (x86_64 macOS on
          # an ARM runner), as scripts/smoke.sh does.
          mkdir smoke && cd smoke
          if [[ "$archive" == *.zip ]]; then 7z x "../$archive" > /dev/null; else tar xzf "../$archive"; fi
          cd "$name"
          if [[ "${{ matrix.target }}" == x86_64-apple-darwin && "$(uname -m)" == arm64 ]]; then
            echo "test kit: not run on this runner's CPU (arm64)"
          else
            ./xtask --help > /dev/null
            ./xtask bench --only "plan 10,000" --runs 1 --host smoke
            ls bench/results/*-smoke-*.json
          fi
          cd ../..
          mv "$archive" ..
      - uses: actions/upload-artifact@v4
        with:
          name: xdevcmd-${{ matrix.target }}
          path: |
            xdevcmd-*.tar.gz
            xdevcmd-*.zip
          if-no-files-found: error

  release:
    name: draft release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement, kept by GitHub, that each archive was
      # built here from this tag's commit. `gh attestation verify <archive> -R
      # nci-gis/rust-commander` checks it (docs/security.md, "Checking a download").
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xdevcmd-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && sha256sum xdevcmd-* > SHA256SUMS && cat SHA256SUMS
      - name: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/xdevcmd-*
      # Notes: this version's section of CHANGELOG.md. A release page, unlike a file,
      # keeps every line break, so each wrapped list item is joined back into one line;
      # and it does not resolve a relative link, so each one points at the tag's file.
      - name: notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md |
            awk '/^  [^ ]/ && n { sub(/^ +/, ""); line = line " " $0; next }
                 { if (n) print line; line = $0; n = 1 }
                 END { if (n) print line }' |
            sed -E "s#\]\(([^)#:][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # A pre-release is marked so, and never takes "Latest" from the last release.
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft "${pre[@]}" \
            --title "xdevcmd ${GITHUB_REF_NAME}" --notes-file notes.md
