[package]
name = "rcmd-tui"
version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rcmd"
path = "src/main.rs"

[dependencies]
rcmd-core = { path = "../rcmd-core" }
anyhow = "1"
# crossterm and vt100 are NOT direct dependencies on purpose: ratatui pins its own
# crossterm and tui-term pins its own vt100, and mixing versions gives you two
# incompatible Event enums that look identical in the error message.
# Use ratatui::crossterm and tui_term::vt100 instead.
ratatui = "0.30"
tui-term = "0.3"
portable-pty = "0.9"
vt100 = "0.16"
toml = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
