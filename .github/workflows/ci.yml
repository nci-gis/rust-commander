name: ci

on:
  # Only the two long-lived branches: pushes to them, and pull requests into them.
  # Work on a feat/ branch runs nothing until its pull request, or until someone asks
  # for a run (below), for instance for a build to try on another system.
  push:
    branches: [main, dev]
    # Nothing a test reads: the plan and the changelog. (The tests read README.md and
    # files under docs/, so those still run CI.)
    paths-ignore: [".agents/**", "CHANGELOG.md"]
  pull_request:
    branches: [main, dev]
  # Actions -> ci -> Run workflow, or `gh workflow run ci --ref feat/topic`.
  workflow_dispatch:
  # Advisories are published after code is written. A weekly run catches a new one
  # against dependencies that have not changed. Scheduled runs use main.
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # A Windows build fails rather than make rcmd.exe without its icon.
      RCMD_REQUIRE_ICON: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    strategy:
      # Report every platform's result. A Windows failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The suite starts a real pty and renders real frames, so this is the step that
      # actually says whether rcmd works on this platform.
      - run: cargo test --all
      - run: cargo build --release
      # macos-latest is Apple Silicon, and an Intel Mac cannot run what it builds. Build
      # the Intel half too and join the two, so the one file runs on either.
      - name: universal macOS binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output rcmd-universal \
            target/release/rcmd target/x86_64-apple-darwin/release/rcmd
          lipo rcmd-universal -verify_arch x86_64 arm64
          mv rcmd-universal target/release/rcmd
          lipo -info target/release/rcmd
      # "/" is not allowed in an artifact name, and branches have them (feat/topic), as
      # does a pull request's own ref ("1/merge"): name it after the source branch,
      # with "/" made "-".
      - name: artifact name
        id: artifact
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=rcmd-${{ runner.os }}-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
      # The build that passed, ready to run: try a branch on Windows or macOS without
      # installing Rust there. Under the run's Artifacts; kept for two weeks.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            target/release/rcmd
            target/release/rcmd.exe
          if-no-files-found: error
          retention-days: 14

  cross-check:
    name: cross-check from linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Catches a broken #[cfg] on another platform in seconds, without waiting for
      # that platform's runner.
      - run: cargo check --all-targets --target x86_64-pc-windows-gnu
      - run: cargo check --all-targets --target x86_64-apple-darwin

  dependencies:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known vulnerabilities, licences, duplicate versions and sources, against the
      # rules in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2

