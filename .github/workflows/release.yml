name: release

# A tag v* on main builds xdevcmd for every platform and opens a DRAFT release with the
# archives, SHA256SUMS and the third-party licences; a person reads it and presses
# Publish. Nothing else runs this workflow. A tag cannot be filtered by branch here, so
# the first job refuses a tag that is not on main, and nothing is built after it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Before anything is built for a tag: the tag, the version in Cargo.toml and a dated
  # CHANGELOG section all name the same release, and the tag is on main.
  check:
    name: tag, version and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          bad=0
          cargo_v=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xdevcmd") | .version')
          if [ "$cargo_v" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $cargo_v"; bad=1
          fi
          if ! grep -Eq "^## \[$v\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section '## [$v] - YYYY-MM-DD' (run cargo release)"; bad=1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are tagged on main"; bad=1
          fi
          exit $bad

  licences:
    name: third-party licences
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-about --features cli
      # Fails if any crate is under a licence about.toml does not accept.
      - run: cargo about generate about.hbs -o THIRD-PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: licences
          path: THIRD-PARTY.md

  build:
    name: ${{ matrix.target }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Static: runs on any x86_64 Linux, old distributions included.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # The same for 64-bit ARM Linux (servers, Raspberry Pi with a 64-bit system),
          # built on GitHub's ARM runner: nothing here compiles C, so no cross tools.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p xdevcmd --target ${{ matrix.target }}
        env:
          # xdevcmd.exe without its icon is a broken release, not a warning.
          XDEVCMD_REQUIRE_ICON: ${{ contains(matrix.target, 'windows') && '1' || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: licences
      - name: package
        shell: bash
        run: |
          name="xdevcmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md THIRD-PARTY.md "$name/"
          # Example themes: read from themes/ beside the binary, so they work unpacked.
          cp -r themes "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/xdevcmd.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/xdevcmd" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xdevcmd-${{ matrix.target }}
          path: |
            xdevcmd-*.tar.gz
            xdevcmd-*.zip
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xdevcmd-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && sha256sum xdevcmd-* > SHA256SUMS && cat SHA256SUMS
      # Notes: this version's section of CHANGELOG.md. A release page, unlike a file,
      # keeps every line break, so each wrapped list item is joined back into one line.
      - name: notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md |
            awk '/^  [^ ]/ && n { sub(/^ +/, ""); line = line " " $0; next }
                 { if (n) print line; line = $0; n = 1 }
                 END { if (n) print line }' > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "xdevcmd ${GITHUB_REF_NAME}" --notes-file notes.md
