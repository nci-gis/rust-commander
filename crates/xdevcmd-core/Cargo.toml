[package]
name = "xdevcmd-core"
version.workspace = true
description = "xdevcmd's engine: listing, file operations, archives, find, compare. No terminal code."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = true

[features]
# The fault seam (faults.rs): failures, halts and swaps at the file system calls data
# safety rests on, for tests. Never on in the program people install: only xdevcmd's
# tests turn it on (its dev-dependencies), and a test checks the release binary has none
# of it.
faults = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
png = "0.18.1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
zune-jpeg = "0.5.15"
# How many columns a character takes on the terminal (a CJK one two), for fitting names
# into columns (format.rs). Already in the tree through ratatui.
unicode-width = "0.2"

# O_NONBLOCK, to open a picture someone else may swap for a FIFO without hanging
# (quick view). Already in the tree through ratatui.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# A rename that never replaces what is there (renameat2 on Linux, renameatx_np on
# macOS), without unsafe code here. Already in the tree through crossterm. Also the
# journal's lock (flock) and this machine's name (uname, "system").
rustix = { version = "1", features = ["fs", "process", "system"] }

# Windows' Recycle Bin and macOS' Trash are OS APIs, not a directory you can rename
# into, so they get a crate. Linux keeps the implementation in ops.rs: it is tested
# here, it takes an injectable root so tests never touch the real trash, and when it
# cannot honour the request it asks instead of deciding.
[target.'cfg(not(target_os = "linux"))'.dependencies]
# 5.3: restores keep their extension (fixed 2026-11-05).
trash = "5.3"

# macOS: NSFileManager's trashItem gives back where the item went in the Trash, which
# undo needs; the trash crate drops it. A safe binding, already in the tree via trash.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

# Released and published with xdevcmd, never on its own; see release.toml. No tag of its
# own: the one tag, v{{version}}, comes from xdevcmd.
[package.metadata.release]
tag = false
