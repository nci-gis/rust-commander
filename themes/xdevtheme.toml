# xdevtheme: xdevcmd's own look. Its teal turns into a light that runs across the
# screen to violet; rounded frames with the titles in a notch, a lit cursor row, the
# F keys and the selected tab as slanted segments, a shadow under dialogs.
# Copy it into themes/ beside your config.toml, or keep it in themes/ beside the
# xdevcmd binary, then pick "xdevtheme" in View > Theme... or with
# [theme] name = "xdevtheme". On a 16-colour terminal the [style] part is left off.
base = "dark"
background = "#07090f"
panel = "#0b0e17"
bar = "#10142a"
border = "#232b47"
border_active = "#2ee6d0"
accent = "#2ee6d0"
text = "#d7def0"
text_dim = "#6b7699"
directory = "#7da2ff"
executable = "#5ef0a0"
symlink = "#c08bff"
archive = "#ffb35c"
error = "#ff5f87"
marked = "#ffe066"
cursor = "#151a2c"
cursor_active = "#1d2a4f"

[style]
borders = "rounded"     # plain, rounded, thick or double
titles = "notch"        # line, or notch: ╭┤title├─
gradient = "#a46bff"    # from the accent, on the left, to this on the right; or "none"
cursor = "glow"         # block, or glow: lit from its left edge
marker = true           # a ▌ on the frame at the cursor's row
keys = "slant"          # plain, caps (the number on the accent) or slant: ◢1◤
shadow = "dim"          # none or dim, under dialogs and menus
