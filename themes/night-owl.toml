# Night Owl (https://github.com/sdras/night-owl-vscode-theme, MIT) for xdevcmd: an example theme file.
# Copy it into themes/ beside your config.toml, or keep it in themes/ beside the
# xdevcmd binary, then pick "night-owl" in View > Theme... or with
# [theme] name = "night-owl". Start your own with: xdevcmd --print-theme dark
base = "dark"
background = "#010e17"
panel = "#011627"
bar = "#0b2942"
border = "#1d3b53"
border_active = "#7fdbca"
accent = "#7fdbca"
text = "#d6deeb"
text_dim = "#637777"
directory = "#82aaff"
executable = "#addb67"
symlink = "#c792ea"
archive = "#f78c6c"
error = "#ef5350"
marked = "#ffeb95"
cursor = "#0b2942"
cursor_active = "#1d3b53"
