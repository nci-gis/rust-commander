[workspace]
members = ["crates/xdevcmd-core", "crates/xdevcmd-tui"]
resolver = "2"

# The one place xdevcmd says what it is. Help > About, --help and --version read these at
# compile time, and scripts/sync-about.sh copies them to the GitHub repository's About
# box, so a change here is a change everywhere.
[workspace.package]
version = "0.2.1"
description = "A terminal-style file commander, written in Rust."
authors = ["XDevTeam"]
license = "MIT"
repository = "https://github.com/nci-gis/rust-commander"
# Also the GitHub topics.
keywords = ["file-manager", "tui", "terminal", "commander", "rust"]
edition = "2021"
rust-version = "1.88"   # zip 9, the first release without RUSTSEC-2026-0367..0369 and -0429

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
