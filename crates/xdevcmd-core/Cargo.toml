[package]
name = "xdevcmd-core"
version.workspace = true
description = "xdevcmd's engine: listing, file operations, archives, find, compare. No terminal code."
authors.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
png = "0.18.1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
zune-jpeg = "0.5.15"

# Windows' Recycle Bin and macOS' Trash are OS APIs, not a directory you can rename
# into, so they get a crate. Linux keeps the implementation in ops.rs: it is tested
# here, it takes an injectable root so tests never touch the real trash, and when it
# cannot honour the request it asks instead of deciding.
[target.'cfg(not(target_os = "linux"))'.dependencies]
trash = "5"

# Released with xdevcmd-tui, never on its own; see release.toml.
[package.metadata.release]
release = false
