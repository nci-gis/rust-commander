[workspace]
members = ["crates/xdevcmd-core", "crates/xdevcmd", "xtask"]
# `cargo build`/`cargo test` at the root keep meaning xdevcmd; xtask is run by name.
default-members = ["crates/xdevcmd-core", "crates/xdevcmd"]
resolver = "2"

# The one place xdevcmd says what it is. Help > About, --help and --version read these at
# compile time, and scripts/sync-about.sh copies them to the GitHub repository's About
# box, so a change here is a change everywhere.
[workspace.package]
version = "0.4.0-beta.3"
description = "xDev Commander: a cross-platform, two-pane terminal file manager that extends your shell."
authors = ["XDevTeam"]
license = "MIT"
repository = "https://github.com/nci-gis/rust-commander"
homepage = "https://github.com/nci-gis/rust-commander"
# Also the GitHub topics, with `rust` added by scripts/sync-about.sh (crates.io allows
# five keywords, and every crate there is Rust).
keywords = ["file-manager", "tui", "terminal", "commander", "two-pane"]
categories = ["command-line-utilities", "filesystem"]
edition = "2021"
# The oldest Rust the locked dependencies build on: quantette 0.6 and ordered-float 5.5
# need 1.90 (zip 9, the floor for RUSTSEC-2026-0367..0369 and -0429, needs 1.88). The
# `msrv` CI job builds on exactly this version.
rust-version = "1.90"

[profile.release]
# Fat LTO: about 5 % smaller than thin at the same speed, for the 7 MiB bar in
# scripts/smoke.sh (the owner, 2026-11-25). Not opt-level "s": 29 % smaller but
# listing 100,000 entries ran 46 % slower.
lto = "fat"
codegen-units = 1
strip = true
