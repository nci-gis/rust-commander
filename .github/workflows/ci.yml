name: ci

on:
  # Only the two long-lived branches: pushes to them, and pull requests into them.
  # Work on a feat/ branch runs nothing until its pull request, or until someone asks
  # for a run (below), for instance for a build to try on another system.
  push:
    branches: [main, dev]
    # Nothing a test reads: the plan and the changelog. (The tests read README.md and
    # files under docs/, so those still run CI.)
    paths-ignore: [".agents/**", "CHANGELOG.md"]
  pull_request:
    branches: [main, dev]
  # Actions -> ci -> Run workflow, or `gh workflow run ci --ref feat/topic`.
  workflow_dispatch:
  # Advisories are published after code is written. A weekly run catches a new one
  # against dependencies that have not changed. Scheduled runs use main.
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # A Windows build fails rather than make xdevcmd.exe without its icon.
      XDEVCMD_REQUIRE_ICON: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    strategy:
      # Report every platform's result. A Windows failure must not hide a macOS one.
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: the release has a 64-bit ARM Linux build, so its tests run on
        # ARM too.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Two small file systems of their own for the data-safety tests (Round 029): one
      # to fill (a real "disk full" from the kernel, XDEVCMD_TEST_SMALL_FS) and one to
      # move to across devices (XDEVCMD_TEST_OTHER_DEV). The tests that need them skip,
      # and say so, when the variables are unset, so a developer's machine needs
      # nothing. Mounted here, never by a test.
      - name: small file systems (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/xdev-small /mnt/xdev-other
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs /mnt/xdev-small
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs /mnt/xdev-other
          echo "XDEVCMD_TEST_SMALL_FS=/mnt/xdev-small" >> "$GITHUB_ENV"
          echo "XDEVCMD_TEST_OTHER_DEV=/mnt/xdev-other" >> "$GITHUB_ENV"
      # RAM disks: 8192 and 131072 sectors of 512 bytes (4 MiB, 64 MiB). HFS+, which
      # ignores case as the system disk does.
      - name: small file systems (macOS)
        if: runner.os == 'macOS'
        run: |
          small=$(hdiutil attach -nomount ram://8192 | awk '{print $1}')
          diskutil erasevolume HFS+ xdevsmall "$small"
          other=$(hdiutil attach -nomount ram://131072 | awk '{print $1}')
          diskutil erasevolume HFS+ xdevother "$other"
          echo "XDEVCMD_TEST_SMALL_FS=/Volumes/xdevsmall" >> "$GITHUB_ENV"
          echo "XDEVCMD_TEST_OTHER_DEV=/Volumes/xdevother" >> "$GITHUB_ENV"
      # Windows: the temporary directory is on C:, the workspace on D:.
      - name: another volume (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xdev-other"
          echo "XDEVCMD_TEST_OTHER_DEV=$RUNNER_TEMP\\xdev-other" >> "$GITHUB_ENV"
      # The suite starts a real pty and renders real frames, so this is the step that
      # actually says whether xdevcmd works on this platform.
      - run: cargo test --all
      # What crates.io would get: each crate packed alone and built from the pack, the
      # engine from a temporary local registry. Catches a file the build reads from
      # outside its crate, or a dependency with no version. Once is enough: Linux.
      - name: cargo package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --workspace --locked
      - run: cargo build --release
      # Now that there is a release build: its size, and that it holds no fault seam.
      - run: cargo test -p xdevcmd --test budgets
      # macos-latest is Apple Silicon, and an Intel Mac cannot run what it builds. Build
      # the Intel half too and join the two, so the one file runs on either.
      - name: universal macOS binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output xdevcmd-universal \
            target/release/xdevcmd target/x86_64-apple-darwin/release/xdevcmd
          lipo xdevcmd-universal -verify_arch x86_64 arm64
          mv xdevcmd-universal target/release/xdevcmd
          lipo -info target/release/xdevcmd
      # "/" is not allowed in an artifact name, and branches have them (feat/topic), as
      # does a pull request's own ref ("1/merge"): name it after the source branch,
      # with "/" made "-".
      - name: artifact name
        id: artifact
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # Two Linux runners (x86_64 and ARM): the ARM one says so in its name.
        run: echo "name=xdevcmd-${{ runner.os }}${{ runner.arch == 'ARM64' && runner.os == 'Linux' && '-ARM64' || '' }}-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
      # The build that passed, ready to run: try a branch on Windows or macOS without
      # installing Rust there. Under the run's Artifacts; kept for two weeks.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            target/release/xdevcmd
            target/release/xdevcmd.exe
          if-no-files-found: error
          retention-days: 14

  cross-check:
    name: cross-check from linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Catches a broken #[cfg] on another platform in seconds, without waiting for
      # that platform's runner.
      - run: cargo check --all-targets --target x86_64-pc-windows-gnu
      - run: cargo check --all-targets --target x86_64-apple-darwin

  dependencies:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known vulnerabilities, licences, duplicate versions and sources, against the
      # rules in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2

