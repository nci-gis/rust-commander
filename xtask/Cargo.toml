[package]
name = "xtask"
# Not part of xdevcmd's releases: never published, never versioned by cargo-release.
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "xdevcmd's own tasks: `cargo xtask bench` (Round 032)"

[package.metadata.release]
release = false

# Only crates already in Cargo.lock: the shipped tree and deny.toml do not move.
[dependencies]
xdevcmd-core = { path = "../crates/xdevcmd-core" }
serde_json = "1"
portable-pty = "0.9"
