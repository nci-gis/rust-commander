# cargo-release (`cargo install --locked cargo-release`): the mechanical half of a
# release — the version, the CHANGELOG headings, the commit and the tag. The steps are
# in docs/development.md, "Releasing". The notes themselves are written by hand.
allow-branch = ["dev", "main"]
# Never from cargo-release: a version on crates.io can never be replaced, and one
# `cargo release` without `--no-publish` would have put a pre-release there for good
# (review, 2026-11-14). Both crates go to crates.io from 0.4.0 on, by hand: step 5 of
# docs/development.md, "Releasing" (`cargo publish -p xdevcmd-core`, then
# `-p xdevcmd`), on main at the tag, by the owner. The GitHub release itself is the one
# the tag starts.
publish = false
# xdevcmd-core and xdevcmd share [workspace.package] version; one commit, one tag.
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
tag-message = "xdevcmd {{version}}"
pre-release-commit-message = "Release {{version}}"
