[workspace]
members = ["crates/xdevcmd-core", "crates/xdevcmd"]
resolver = "2"

# The one place xdevcmd says what it is. Help > About, --help and --version read these at
# compile time, and scripts/sync-about.sh copies them to the GitHub repository's About
# box, so a change here is a change everywhere.
[workspace.package]
version = "0.3.0"
description = "xDev Commander: a cross-platform, two-pane terminal file manager that extends your shell."
authors = ["XDevTeam"]
license = "MIT"
repository = "https://github.com/nci-gis/rust-commander"
homepage = "https://github.com/nci-gis/rust-commander"
# Also the GitHub topics, with `rust` added by scripts/sync-about.sh (crates.io allows
# five keywords, and every crate there is Rust).
keywords = ["file-manager", "tui", "terminal", "commander", "two-pane"]
categories = ["command-line-utilities", "filesystem"]
edition = "2021"
rust-version = "1.88"   # zip 9, the first release without RUSTSEC-2026-0367..0369 and -0429

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
