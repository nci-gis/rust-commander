# xdevtheme-dawn: the light pair of xdevtheme, for a terminal with a light background.
# The same [style]; the teal is deeper so it reads on white.
# Pick "xdevtheme-dawn" in View > Theme... or with [theme] name = "xdevtheme-dawn".
base = "light"
background = "#eef1f8"
panel = "#fbfcff"
bar = "#e3e7f3"
border = "#cfd5e6"
border_active = "#0ca896"
accent = "#0ca896"
text = "#1b2232"
text_dim = "#7b849a"
directory = "#3654d6"
executable = "#13804b"
symlink = "#8a3fe0"
archive = "#c8540c"
error = "#d92b3a"
marked = "#b07d00"
cursor = "#e6eaf3"
cursor_active = "#d9f3ef"

[style]
borders = "rounded"
titles = "notch"
gradient = "#8b5cf6"
cursor = "glow"
marker = true
keys = "slant"
shadow = "dim"
