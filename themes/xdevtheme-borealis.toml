# xdevtheme-borealis: a night sky. An aurora runs down the screen from teal to violet,
# the frames change colour with it, and a few stars sit in the empty rows of the file
# panes. The stars are fixed: they do not move or cost anything while xdevcmd waits.
# Pick "xdevtheme-borealis" in View > Theme... or with
# [theme] name = "xdevtheme-borealis". On a 16-colour terminal the [style] part is off.
base = "dark"
background = "#050713"
panel = "#070a18"
bar = "#121a3c"
border = "#1d2547"
border_active = "#43f0d6"
accent = "#43f0d6"
text = "#dbe4ff"
text_dim = "#66729c"
directory = "#8fb0ff"
executable = "#6cf5b0"
symlink = "#cf9dff"
archive = "#ffbd6b"
error = "#ff6b95"
marked = "#fff07a"
cursor = "#11173a"
cursor_active = "#1b2a5c"

[style]
borders = "rounded"
titles = "notch"
gradient = "#a46bff"
gradient_runs = "down"  # teal at the top, violet at the bottom
cursor = "glow"
marker = true
keys = "caps"
shadow = "dim"
sky = true
stars = true
